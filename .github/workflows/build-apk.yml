name: Build and Download Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{print $1}')
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Java major version is $JAVA_MAJOR, which is lower than 17."
            exit 1
          fi
          echo "Java major version ($JAVA_MAJOR) is 17 or newer."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create signed application keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "Generating signed application keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=PaperGenius AI,OU=Education,O=PaperGenius AI,L=New Delhi,ST=Delhi,C=IN"
          else
            echo "debug.keystore already exists."
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: debug.keystore could not be created."
            exit 1
          fi
          echo "debug.keystore confirmed."

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon
          mkdir -p app/build/outputs/apk/debug
          if [ -f "android-app/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp android-app/app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/app-debug.apk
          fi

      - name: Verify APK exists
        run: |
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Locating generated debug APK..."
            mkdir -p app/build/outputs/apk/debug
            DISCOVERED_APK=$(find . -name "*debug*.apk" -path "*/outputs/apk/*" 2>/dev/null | head -n 1)
            if [ -n "$DISCOVERED_APK" ] && [ -f "$DISCOVERED_APK" ]; then
              echo "Discovered APK: $DISCOVERED_APK"
              cp "$DISCOVERED_APK" app/build/outputs/apk/debug/app-debug.apk
            else
              echo "ERROR: No debug APK discovered in project"
              find . -name "*.apk" 2>/dev/null || true
              exit 1
            fi
          fi
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
