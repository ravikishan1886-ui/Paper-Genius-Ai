name: Build and Download Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{print $1}')
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Java major version is $JAVA_MAJOR, which is lower than 17."
            exit 1
          fi
          echo "Java major version ($JAVA_MAJOR) is 17 or newer."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create signed application keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "Generating signed application keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=PaperGenius AI,OU=Education,O=PaperGenius AI,L=New Delhi,ST=Delhi,C=IN"
          else
            echo "debug.keystore already exists."
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: debug.keystore could not be created."
            exit 1
          fi
          cp ./debug.keystore android-app/debug.keystore 2>/dev/null || true
          echo "debug.keystore confirmed in root and android-app."

      - name: Build Debug and Release APKs
        run: |
          gradle :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon
          mkdir -p app/build/outputs/apk/debug app/build/outputs/apk/release
          find . -name "*release*.apk" -exec cp {} app/build/outputs/apk/release/PaperGenius-AI-v1.1-release.apk \; 2>/dev/null || true
          find . -name "*debug*.apk" -exec cp {} app/build/outputs/apk/debug/PaperGenius-AI-v1.1-debug.apk \; 2>/dev/null || true
          cp app/build/outputs/apk/release/PaperGenius-AI-v1.1-release.apk app/build/outputs/apk/release/app-release.apk 2>/dev/null || true
          cp app/build/outputs/apk/debug/PaperGenius-AI-v1.1-debug.apk app/build/outputs/apk/debug/app-debug.apk 2>/dev/null || true

      - name: Verify APKs exist
        run: |
          if [ ! -f "app/build/outputs/apk/debug/PaperGenius-AI-v1.1-debug.apk" ]; then
            echo "Locating generated debug APK..."
            DISCOVERED_APK=$(find . -name "*debug*.apk" -path "*/outputs/apk/*" 2>/dev/null | head -n 1)
            if [ -n "$DISCOVERED_APK" ] && [ -f "$DISCOVERED_APK" ]; then
              cp "$DISCOVERED_APK" app/build/outputs/apk/debug/PaperGenius-AI-v1.1-debug.apk
              cp "$DISCOVERED_APK" app/build/outputs/apk/debug/app-debug.apk
            fi
          fi
          if [ ! -f "app/build/outputs/apk/release/PaperGenius-AI-v1.1-release.apk" ]; then
            echo "Locating generated release APK..."
            DISCOVERED_REL=$(find . -name "*release*.apk" -path "*/outputs/apk/*" 2>/dev/null | head -n 1)
            if [ -n "$DISCOVERED_REL" ] && [ -f "$DISCOVERED_REL" ]; then
              cp "$DISCOVERED_REL" app/build/outputs/apk/release/PaperGenius-AI-v1.1-release.apk
              cp "$DISCOVERED_REL" app/build/outputs/apk/release/app-release.apk
            fi
          fi
          ls -lh app/build/outputs/apk/*/*.apk

      - name: Calculate and Print SHA-256 Hashes
        run: |
          echo "=========================================================="
          echo "NEW v1.1.0 RELEASE APK SHA-256 CHECKSUM:"
          sha256sum app/build/outputs/apk/release/PaperGenius-AI-v1.1-release.apk | awk '{print $1}'
          echo "NEW v1.1.0 DEBUG APK SHA-256 CHECKSUM:"
          sha256sum app/build/outputs/apk/debug/PaperGenius-AI-v1.1-debug.apk | awk '{print $1}'
          echo "=========================================================="
          if [ -f "./debug.keystore" ]; then
            echo "CERTIFICATE SHA-256 FINGERPRINT:"
            keytool -list -v -keystore ./debug.keystore -storepass android -alias androiddebugkey | grep "SHA256:" || true
            echo "=========================================================="
          fi

      - name: Upload Debug and Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-apks-v1.1.0
          path: |
            app/build/outputs/apk/debug/PaperGenius-AI-v1.1-debug.apk
            app/build/outputs/apk/release/PaperGenius-AI-v1.1-release.apk
          if-no-files-found: error

      - name: Publish Public Release for Universal Direct Download
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0
          name: "PaperGenius AI Android APK (v1.1.0 - Build 2)"
          body: |
            ### Official PaperGenius AI Android APK v1.1.0 (Build 2)
            * **Package**: `com.papergenius.ai`
            * **Version**: `1.1.0` (Build Code: 2)
            * **Target SDK**: Android 34/35 (Fully tested on Android 15 & OnePlus OxygenOS 15)
            * **Status**: Signed with custom RSA-2048 key, MultiDex enabled, Edge-to-Edge window decor compliant.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/PaperGenius-AI-v1.1-release.apk
            app/build/outputs/apk/debug/PaperGenius-AI-v1.1-debug.apk
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
