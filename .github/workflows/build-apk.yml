name: Build and Download Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Create temporary debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f "./debug.keystore" ]; then
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp ./debug.keystore ~/.android/debug.keystore
          if [ -d "android-app" ]; then
            cp ./debug.keystore android-app/debug.keystore
          fi
          echo "Debug keystore configured successfully."

      - name: Make Gradle wrapper executable
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          chmod +x android-app/gradlew 2>/dev/null || true

      - name: Build debug APK with Gradle
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          elif [ -f "android-app/gradlew" ]; then
            cd android-app
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
            cd ..
          fi

      - name: Verify and place APK
        run: |
          mkdir -p app/build/outputs/apk/debug
          APK_PATH=$(find . -name "*.apk" | grep -i "debug" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            cp "$APK_PATH" app/build/outputs/apk/debug/app-debug.apk
            ls -lh app/build/outputs/apk/debug/app-debug.apk
          else
            echo "Error: Debug APK was not generated."
            find . -name "*.apk" || true
            exit 1
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
