name: Build and Download Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Configure Android SDK environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          # Remove any invalid local.properties
          rm -f local.properties android-app/local.properties
          
          # Create valid local.properties with runner's SDK location
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -d "android-app" ]; then
            echo "sdk.dir=$ANDROID_HOME" > android-app/local.properties
          fi

      - name: Create temporary debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f "~/.android/debug.keystore" ]; then
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          cp ~/.android/debug.keystore ./debug.keystore
          if [ -d "android-app" ]; then
            cp ~/.android/debug.keystore android-app/debug.keystore
          fi
          echo "Debug keystore configured successfully."

      - name: Build Debug APK
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          chmod +x android-app/gradlew 2>/dev/null || true
          
          if [ -d "android-app" ] && [ -f "android-app/gradlew" ]; then
            echo "Building inside android-app directory..."
            cd android-app
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
            cd ..
          elif [ -f "./gradlew" ]; then
            echo "Building at root directory..."
            ./gradlew :app:assembleDebug --stacktrace --no-daemon
          fi

      - name: Verify and place APK
        run: |
          mkdir -p app/build/outputs/apk/debug
          APK_FILE=$(find . -name "*.apk" 2>/dev/null | grep -i "debug" | head -n 1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "Discovered APK at: $APK_FILE"
            cp "$APK_FILE" app/build/outputs/apk/debug/app-debug.apk
            ls -lh app/build/outputs/apk/debug/app-debug.apk
          else
            echo "ERROR: Debug APK file was not produced."
            find . -name "*.apk" 2>/dev/null || true
            exit 1
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
